# A virtual manifest: the root builds nothing itself, so no frontend is privileged over another.
# Nothing below `maestro-client` knows a UI exists; the gpui and ratatui frontends arrive later.
[workspace]
members = ["crates/*"]
# Plain `cargo run` at the root opens the desktop app. Use `--workspace` to build or test the
# rest, as CI and CLAUDE.md do.
default-members = ["crates/maestro-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/uthree/maestro"
rust-version = "1.95"

[workspace.dependencies]
maestro-core = { path = "crates/maestro-core", version = "0.1.0" }
maestro-protocol = { path = "crates/maestro-protocol", version = "0.1.0" }
maestro-daemon = { path = "crates/maestro-daemon", version = "0.1.0" }
maestro-client = { path = "crates/maestro-client", version = "0.1.0" }
maestro-host = { path = "crates/maestro-host", version = "0.1.0" }
maestro-agents = { path = "crates/maestro-agents", version = "0.1.0" }
maestro-gui = { path = "crates/maestro-gui", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"
