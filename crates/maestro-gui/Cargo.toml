[package]
name = "maestro-gui"
description = "The gpui desktop frontend for Maestro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "maestro"
path = "src/main.rs"

[dependencies]
maestro-client.workspace = true
maestro-core.workspace = true
# The daemon rides in the same executable, so a local window never meets an older one.
maestro-daemon.workspace = true
maestro-protocol.workspace = true

# `runtime_shaders` compiles the Metal shaders at start-up, so the app builds on a Mac with only
# the Command Line Tools installed.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Atelier, including the optional fast-mode control for reasoning-only pickers.
atelier = { git = "https://github.com/uthree/design-language", rev = "a0a2b985d78882de483634284f017106b00b1b03" }
# Text editing (caret, selection, IME) and popup lifecycle; Atelier supplies their visual
# surfaces. Later releases need gpui snapshots; 0.5.1 is the last on gpui 0.2.2.
gpui-component = "=0.5.1"
# The daemon's events reach the window as a stream its tasks await.
futures = "0.3"
# `RUST_LOG=info maestro` shows what gpui says about the window and the GPU.
env_logger = "0.11"
# The window's own preferences, saved on this computer.
serde.workspace = true
serde_json.workspace = true
# The system language, which picks between the English and Japanese strings.
sys-locale = "0.3.2"

[lints]
workspace = true
