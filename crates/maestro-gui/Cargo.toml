[package]
name = "maestro-gui"
description = "The gpui desktop frontend for Maestro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "maestro"
path = "src/main.rs"

[dependencies]
maestro-client.workspace = true
maestro-core.workspace = true
# The daemon rides in the same executable, so a local window never meets an older one.
maestro-daemon.workspace = true
maestro-markdown.workspace = true
maestro-protocol.workspace = true

# `runtime_shaders` compiles the Metal shaders at start-up, so the app builds on a Mac with only
# the Command Line Tools installed.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Atelier, the design language, pinned to a reviewed revision of its main branch.
atelier = { git = "https://github.com/uthree/design-language", rev = "ea00dad96a12105836e963a20fd257e4cfc1a474" }
# Only for its text input (caret, selection, IME); Atelier ships no editor. Later releases need
# gpui snapshots, and 0.5.1 is the last on gpui 0.2.2.
gpui-component = "=0.5.1"
# Display maths typeset as KaTeX would, in pure Rust with its fonts built in; the formula is
# drawn to an image in the theme's text colour. Inline maths stays text (maestro-markdown).
ratex-parser = "=0.1.13"
ratex-layout = "=0.1.13"
ratex-render = { version = "=0.1.13", features = ["embed-fonts"] }
ratex-types = "=0.1.13"
# The daemon's events reach the window as a stream its tasks await.
futures = "0.3"
# `RUST_LOG=info maestro` shows what gpui says about the window and the GPU.
env_logger = "0.11"
# The window's own preferences, saved on this computer.
serde.workspace = true
serde_json.workspace = true
# The system language, which picks between the English and Japanese strings.
sys-locale = "0.3.2"

[build-dependencies]
# Embeds the application icon in the Windows executable (see build.rs).
embed-resource = "3.0"

[lints]
workspace = true
